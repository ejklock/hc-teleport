services:
  source:
    build: .
    image: hc-teleport-bed:local
    init: true
    hostname: source
    environment:
      BED_ROLE: source
      BED_USER: mac
      BED_HOME: /Users/mac
    volumes:
      - ${BED_KEY_DIR:?set by the bed helper}/id_ed25519:/run/bed/key:ro
      - ${BED_REPO:?set by the bed helper}:/opt/hc-teleport:ro
    healthcheck: &sshd
      test: ["CMD-SHELL", "test -s /run/sshd.pid"]
      interval: 1s
      timeout: 2s
      retries: 60

  dest:
    image: hc-teleport-bed:local
    pull_policy: never
    init: true
    hostname: dest
    environment:
      BED_ROLE: dest
      BED_USER: box
      BED_HOME: /home/box
    volumes:
      - ${BED_KEY_DIR:?set by the bed helper}/id_ed25519.pub:/run/bed/key.pub:ro
    healthcheck: *sshd

networks:
  default:
    ipam:
      config:
        - subnet: ${BED_SUBNET:?set by the bed helper}
